<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- 3D Juicy Mango Cube -->
  <defs>
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE76B"/>
      <stop offset="100%" stop-color="#FFC500"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAE00"/>
      <stop offset="100%" stop-color="#E88200"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
  </defs>
  <!-- Top Face -->
  <polygon points="50,18 82,34 50,50 18,34" fill="url(#topFace)"/>
  <!-- Left Face -->
  <polygon points="18,34 50,50 50,84 18,68" fill="url(#leftFace)"/>
  <!-- Right Face -->
  <polygon points="50,50 82,34 82,68 50,84" fill="url(#rightFace)"/>
  <!-- Glossy Highlights -->
  <circle cx="48" cy="32" r="5" fill="#FFFFFF" opacity="0.6"/>
  <ellipse cx="65" cy="50" rx="2" ry="6" fill="#FFFFFF" opacity="0.3"/>
</svg>
