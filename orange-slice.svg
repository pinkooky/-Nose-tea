<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Orange Slice Half Wheel -->
  <defs>
    <radialGradient id="rind" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#FF7A00"/>
      <stop offset="95%" stop-color="#FF5100"/>
      <stop offset="100%" stop-color="#D93B00"/>
    </radialGradient>
    <radialGradient id="pulp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="85%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#FF6B00"/>
    </radialGradient>
  </defs>
  <!-- Outer Rind -->
  <path d="M 10 50 A 40 40 0 0 0 90 50 Z" fill="url(#rind)"/>
  <!-- Inner White Pith -->
  <path d="M 14 50 A 36 36 0 0 0 86 50 Z" fill="#FFF5EA"/>
  <!-- Pulp segments -->
  <g fill="url(#pulp)">
    <path d="M 18 48 A 32 32 0 0 0 28 32 L 48 48 Z"/>
    <path d="M 31 30 A 32 32 0 0 0 47 20 L 49 46 Z"/>
    <path d="M 53 20 A 32 32 0 0 0 69 30 L 51 46 Z"/>
    <path d="M 72 32 A 32 32 0 0 0 82 48 L 52 48 Z"/>
  </g>
  <!-- Center seeds / shine -->
  <circle cx="50" cy="48" r="3" fill="#FFF8EE"/>
  <ellipse cx="38" cy="35" rx="2" ry="4" transform="rotate(-30 38 35)" fill="#FFFFFF" opacity="0.6"/>
</svg>
