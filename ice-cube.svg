<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Crystalline Ice Cube -->
  <defs>
    <linearGradient id="iceTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#CBE9FF" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="iceLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#97D2FB" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#5CA8E6" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="iceRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BEE3FB" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7BBFF2" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <!-- Top Face -->
  <polygon points="50,15 85,32 50,50 15,32" fill="url(#iceTop)" stroke="#FFFFFF" stroke-width="1.5"/>
  <!-- Left Face -->
  <polygon points="15,32 50,50 50,85 15,68" fill="url(#iceLeft)" stroke="#FFFFFF" stroke-width="1.5"/>
  <!-- Right Face -->
  <polygon points="50,50 85,32 85,68 50,85" fill="url(#iceRight)" stroke="#FFFFFF" stroke-width="1.5"/>
  <!-- Internal fracture & bubbles -->
  <path d="M 45 42 L 32 60 L 40 70" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
  <circle cx="62" cy="55" r="3" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="70" cy="48" r="1.5" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="30" cy="45" r="2" fill="#FFFFFF" opacity="0.5"/>
</svg>
